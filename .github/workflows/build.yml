name: Build distributions

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
            architecture: arm64
          - os: macos-15-intel
            platform: macos
            architecture: x64
          # Build against glibc 2.35 so the binary runs on older distributions.
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux runtime libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libpulse-mainloop-glib0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            openbox \
            upx-ucl \
            xvfb

      - name: Install Windows executable compressor
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install upx --no-progress --yes

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile Qt resources
        run: python -m PyQt5.pyrcc_main resources.qrc -o resources_rc.py

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: python -m PyInstaller --noconfirm --clean space-debris-windows.spec

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: python -m PyInstaller --noconfirm --clean space-debris-macos.spec

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: python -m PyInstaller --noconfirm --clean space-debris-linux.spec

      - name: Smoke test Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/Space Debris/Space Debris.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Smoke test macOS package
        if: matrix.platform == 'macos'
        run: '"dist/Space Debris.app/Contents/MacOS/Space Debris" --smoke-test'

      - name: Smoke test Linux package
        if: matrix.platform == 'linux'
        run: |
          set +e
          smoke_output="$(xvfb-run -a sh -c '
            openbox >/tmp/space-debris-openbox.log 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            sleep 1
            "$1" --smoke-test
          ' sh "dist/Space Debris/Space Debris" 2>&1)"
          smoke_status=$?
          set -e
          printf '%s\n' "$smoke_output"
          if [ "$smoke_status" -ne 0 ]; then
            annotation="$(printf '%s' "$smoke_output" | tail -c 1500 | tr '\n' ' ')"
            echo "::error title=Linux package failed to launch::$annotation"
            exit "$smoke_status"
          fi

      - name: Validate macOS release-signing secrets
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Developer ID certificate
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::The certificate archive does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign macOS package for release
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "dist/Space Debris.app"
          codesign --verify --deep --strict --verbose=2 "dist/Space Debris.app"

      - name: Ad-hoc sign macOS development package
        if: matrix.platform == 'macos' && !(startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        run: codesign --force --deep --sign - "dist/Space Debris.app"

      - name: Verify macOS bundle integrity
        if: matrix.platform == 'macos'
        run: |
          broken_link="$(find -L "dist/Space Debris.app" -type l -print -quit)"
          if [ -n "$broken_link" ]; then
            echo "::error::Broken bundle symlink: $broken_link"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "dist/Space Debris.app"

      - name: Prepare macOS package for notarization
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        run: ditto -c -k --keepParent "dist/Space Debris.app" "$RUNNER_TEMP/space-debris-notarization.zip"

      - name: Notarize and staple macOS release
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_macos)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/space-debris-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/Space Debris.app"
          xcrun stapler validate "dist/Space Debris.app"
          spctl --assess --type execute --verbose=2 "dist/Space Debris.app"

      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Space Debris" -DestinationPath "space-debris-windows-${{ runner.arch }}.zip"

      - name: Archive macOS package
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent "dist/Space Debris.app" "space-debris-macos-${{ matrix.architecture }}.zip"

      - name: Archive Linux package
        if: matrix.platform == 'linux'
        run: tar -C dist -czf "space-debris-linux-${{ runner.arch }}.tar.gz" "Space Debris"

      - uses: actions/upload-artifact@v4
        with:
          name: space-debris-${{ matrix.platform }}-${{ matrix.architecture || runner.arch }}
          path: |
            space-debris-*.zip
            space-debris-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: space-debris-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Space Debris ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
